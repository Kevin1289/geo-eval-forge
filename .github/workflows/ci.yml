name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    name: offline (verifiers + invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: validate task schemas
        run: geoeval validate
      - name: grade candidates (golden passes / wrong fails)
        run: geoeval run --offline --check
      - name: unit + offline tests
        run: pytest -q

  live:
    name: live (PostGIS)
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: geoeval
          POSTGRES_USER: geoeval
          POSTGRES_PASSWORD: geoeval
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geoeval -d geoeval"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: geoeval
      POSTGRES_USER: geoeval
      POSTGRES_PASSWORD: geoeval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[live,dev]"
      - name: enable PostGIS + load seed
        run: python -m data.seed.make_seed
      - name: grade candidates against the live stack
        run: geoeval run --live --check
      - name: integration tests
        run: pytest -q -m integration

  dashboard:
    name: dashboard (static export)
    runs-on: ubuntu-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: generate results
        run: geoeval run --offline
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: copy results into dashboard
        run: |
          mkdir -p dashboard/public
          cp results/results.json dashboard/public/results.json
          cp -r results/geojson dashboard/public/geojson
      - name: build static site
        run: cd dashboard && npm install && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dashboard/out
