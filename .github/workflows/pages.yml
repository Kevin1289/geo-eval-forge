name: deploy-dashboard

# Builds the static dashboard from a fresh offline run and publishes it to
# GitHub Pages. Enable once under Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: generate results + judge agreement
        run: |
          geoeval run --offline
          geoeval judge
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: copy results into dashboard
        run: |
          mkdir -p dashboard/public
          cp results/results.json dashboard/public/results.json
          cp -r results/geojson dashboard/public/geojson
      - name: build static site (basePath = repo name)
        # export inline so the var applies to THIS step's `npm run build`
        # (a $GITHUB_ENV write would only affect later steps).
        run: |
          export PAGES_BASE_PATH="/${GITHUB_REPOSITORY#*/}"
          cd dashboard && npm install && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
